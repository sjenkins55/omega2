name: BabyTracker
options:
  bundleIdPrefix: com.babytracker
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  groupSortPosition: top
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""          # Set your Apple Team ID here (or in CI env)
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  # Uncomment and set correct URLs once you're ready to activate SDKs
  # supabase-swift:
  #   url: https://github.com/supabase/supabase-swift
  #   from: "2.0.0"
  # RevenueCat:
  #   url: https://github.com/RevenueCat/purchases-ios
  #   from: "4.0.0"

targets:

  # ─── Main App ────────────────────────────────────────────────────────────────
  BabyTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.babytracker.app

    sources:
      - path: BabyTracker
        excludes:
          - "**/.DS_Store"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babytracker.app
        INFOPLIST_FILE: BabyTracker/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        APP_GROUP_ID: group.com.babytracker

    entitlements:
      path: BabyTracker/BabyTracker.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.babytracker
        com.apple.developer.associated-domains: []

    dependencies:
      - target: BabyTrackerWidgetExtension
    #  - package: supabase-swift
    #    product: Supabase
    #  - package: RevenueCat
    #    product: RevenueCat

  # ─── Widget Extension ─────────────────────────────────────────────────────
  BabyTrackerWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    bundleId: com.babytracker.app.widget

    sources:
      - path: BabyTrackerWidget
        excludes:
          - "**/.DS_Store"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.babytracker.app.widget
        INFOPLIST_FILE: BabyTrackerWidget/Info.plist
        CODE_SIGN_STYLE: Automatic
        APP_GROUP_ID: group.com.babytracker
        SUPPORTS_MACCATALYST: NO

    entitlements:
      path: BabyTrackerWidget/BabyTrackerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.babytracker
