services:
  # FastAPI backend
  - type: web
    name: concertocare-api
    runtime: python
    rootDir: emr/apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # set manually in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a random value
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        sync: false          # set to ["https://your-app.vercel.app"]
      - key: AI_PROVIDER
        value: anthropic
    healthCheckPath: /health

  # Next.js frontend (alternative to Vercel — use one or the other)
