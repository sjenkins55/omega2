name: baby_tracker
description: Baby tracker app — offline-first, multi-caregiver, Supabase sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ──────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Database (offline-first SQLite ORM) ───────────────────────────────────
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlite3_flutter_libs: ^0.5.24

  # ── Navigation ─────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Supabase backend ───────────────────────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── Authentication ─────────────────────────────────────────────────────────
  sign_in_with_apple: ^6.1.1
  google_sign_in: ^6.2.1          # Android auth option
  crypto: ^3.0.3                  # SHA-256 nonce

  # ── Notifications ──────────────────────────────────────────────────────────
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # ── Charts ─────────────────────────────────────────────────────────────────
  fl_chart: ^0.68.0

  # ── Connectivity ───────────────────────────────────────────────────────────
  connectivity_plus: ^6.0.3

  # ── Images ─────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # ── Storage ────────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.2

  # ── Utilities ──────────────────────────────────────────────────────────────
  uuid: ^4.4.2
  intl: ^0.19.0
  collection: ^1.18.0
  path_provider: ^2.1.3
  url_launcher: ^6.3.0

  # ── UI helpers ─────────────────────────────────────────────────────────────
  flutter_svg: ^2.0.10+1
  share_plus: ^10.0.0

  # ── In-app purchases (uncomment when activating RevenueCat) ───────────────
  # purchases_flutter: ^7.7.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
